<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>examIA – Exámenes tipo test con IA</title>
  <meta name="description" content="Sube tu PDF y genera exámenes tipo test con inteligencia artificial" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0f1a;
      --surface: #131829;
      --surface2: #1a2035;
      --surface3: #212840;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --text: #edf0f7;
      --muted: #7a8099;
      --hint: #4a5068;
      --gold: #e8b84b;
      --gold-dim: rgba(232,184,75,0.12);
      --gold-glow: rgba(232,184,75,0.25);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.1);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.1);
      --r: 12px;
      --r-sm: 8px;
      --font-head: 'Lora', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }

    .examia-app { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
    .glow-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
    .glow-orb-1 { width: 600px; height: 600px; top: -200px; left: -150px; background: radial-gradient(circle, rgba(232,184,75,0.06) 0%, transparent 70%); }
    .glow-orb-2 { width: 500px; height: 500px; bottom: -150px; right: -100px; background: radial-gradient(circle, rgba(96,165,250,0.05) 0%, transparent 70%); }

    .header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; background: rgba(11,15,26,0.88); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .logo { font-family: var(--font-head); font-size: 20px; font-weight: 700; color: var(--gold); cursor: pointer; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; user-select: none; }
    .logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); display: inline-block; }
    .nav-pill { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font-body); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .nav-pill:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface2); }
    .nav-pill.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--red); color: white; }

    .main { flex: 1; max-width: 820px; width: 100%; margin: 0 auto; padding: 48px 24px 80px; position: relative; z-index: 1; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; height: 42px; border-radius: var(--r-sm); font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.18s; border: 1px solid transparent; white-space: nowrap; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .btn-gold { background: var(--gold); color: #0b0f1a; border-color: var(--gold); }
    .btn-gold:hover:not(:disabled) { background: #f0c75c; box-shadow: 0 4px 20px var(--gold-glow); transform: translateY(-1px); }
    .btn-ghost { background: var(--surface2); color: var(--text); border-color: var(--border); }

    .btn-outline { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-outline:hover:not(:disabled) { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }
    .btn-danger-outline { background: transparent; color: var(--red); border-color: rgba(248,113,113,0.3); }

    .opt-btn { display: flex; align-items: flex-start; gap: 11px; padding: 13px 16px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--r-sm); cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--text); text-align: left; line-height: 1.5; transition: all 0.18s; }
    .opt-btn:hover:not(:disabled):not(.opt-selected):not(.opt-correct):not(.opt-wrong) { border-color: rgba(232,184,75,0.4); background: var(--gold-dim); }

    .score-circle { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid var(--gold); background: var(--gold-dim); box-shadow: 0 0 40px var(--gold-glow); }
    .score-num { font-family: var(--font-head); font-size: 36px; font-weight: 700; color: var(--gold); line-height: 1; }

    .fallos-notice { padding: 14px 18px; background: var(--red-dim); border: 1px solid rgba(248,113,113,0.2); border-radius: var(--r-sm); font-size: 14px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

    .fallo-item { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid rgba(248,113,113,0.4); border-radius: var(--r); padding: 18px 20px; margin-bottom: 10px; transition: border-left-color 0.2s; }
    .fallo-item:hover { border-left-color: var(--red); }

    .fallo-correct { font-size: 13px; color: var(--muted); }
    .fallo-correct span { color: var(--green); font-weight: 600; }

    .error-box { padding: 16px 20px; background: var(--red-dim); border: 1px solid rgba(248,113,113,0.25); border-radius: var(--r-sm); font-size: 14px; color: var(--red); margin-bottom: 20px; }
    .q-mode-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(232,184,75,0.25); }
    .q-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 10px; }

    .review-banner.success { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
    .review-banner.warning { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }

    /* API KEY MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const API_URL = "https://api.anthropic.com/v1/messages";

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    async function withRetry(fn, onWait, maxRetries = 4) {
      const delays = [15, 30, 45, 60]; // seconds to wait on each retry
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          return await fn();
        } catch (err) {
          const isRateLimit = err.message && (
            err.message.includes("rate limit") ||
            err.message.includes("rate_limit") ||
            err.message.includes("529") ||
            err.message.includes("429")
          );
          if (isRateLimit && attempt < maxRetries) {
            const wait = delays[attempt] || 60;
            for (let s = wait; s > 0; s--) {
              onWait(`Límite de velocidad alcanzado. Reintentando en ${s}s… (intento ${attempt + 1}/${maxRetries})`);
              await sleep(1000);
            }
            onWait("Reintentando…");
          } else {
            throw err;
          }
        }
      }
    }
    const LETTERS = ["A", "B", "C", "D"];
    const STORAGE_KEY = "examia_fallos";
    
    const APIKEY_STORAGE = "examia_apikey";

    // ── IndexedDB helpers ──────────────────────────────────
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("examia_db", 1);
        req.onupgradeneeded = e => {
          e.target.result.createObjectStore("pdfs", { keyPath: "id", autoIncrement: true });
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbSavePdf(pdf) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("pdfs", "readwrite");
        const req = tx.objectStore("pdfs").add({ name: pdf.name, size: pdf.size, base64: pdf.base64, savedAt: Date.now() });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbLoadPdfs() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction("pdfs", "readonly").objectStore("pdfs").getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbDeletePdf(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction("pdfs", "readwrite").objectStore("pdfs").delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }
    async function idbUpdatePdf(id, updates) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("pdfs", "readwrite");
        const store = tx.objectStore("pdfs");
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          const putReq = store.put({ ...getReq.result, ...updates });
          putReq.onsuccess = () => resolve();
          putReq.onerror = () => reject(putReq.error);
        };
        getReq.onerror = () => reject(getReq.error);
      });
    }

    function loadFallos() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch { return []; }
    }
    function saveFallos(arr) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch {}
    }
    function loadApiKey() {
      try { return localStorage.getItem(APIKEY_STORAGE) || ""; } catch { return ""; }
    }
    function saveApiKey(key) {
      try { localStorage.setItem(APIKEY_STORAGE, key); } catch {}
    }

    // Extract text once → reuse for all future exams (saves tokens)
    async function extractTextFromPdf(pdfBase64, apiKey) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 8000,
          messages: [{
            role: "user",
            content: [
              { type: "document", source: { type: "base64", media_type: "application/pdf", data: pdfBase64 } },
              { type: "text", text: "Extrae todo el contenido textual de este documento PDF manteniendo la estructura (títulos, secciones, párrafos, listas). Devuelve únicamente el texto extraído, sin comentarios ni explicaciones." }
            ]
          }]
        })
      });
      if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || `Error ${res.status}`); }
      const data = await res.json();
      return data.content.find(b => b.type === "text")?.text || "";
    }

    // Generate questions from already-extracted text (much cheaper)
    async function generateFromText(textContent, numQ, apiKey) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 4096,
          messages: [{
            role: "user",
            content: `Basándote en el siguiente temario, genera exactamente ${numQ} preguntas de examen tipo test en español.
Devuelve ÚNICAMENTE un array JSON válido, sin markdown ni texto extra. Cada elemento debe tener:
- "question": string (la pregunta clara y completa)
- "options": array de exactamente 4 strings (sin letra de prefijo)
- "correct": number (índice 0-3 de la respuesta correcta)
- "explanation": string (explicación breve en 1-2 frases)
Varía los temas y la dificultad. Las opciones incorrectas deben ser plausibles.

TEMARIO:
${textContent}`
          }]
        })
      });
      if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || `Error ${res.status}`); }
      const data = await res.json();
      const raw = data.content.find(b => b.type === "text")?.text || "[]";
      const clean = raw.replace(/^```json\s*|^```\s*|```\s*$/gm, "").trim();
      const parsed = JSON.parse(clean);
      if (!Array.isArray(parsed) || !parsed.length) throw new Error("Respuesta inesperada");
      return parsed;
    }

    async function generateFromPdf(pdfBase64, numQ, apiKey) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 4096,
          messages: [{
            role: "user",
            content: [
              { type: "document", source: { type: "base64", media_type: "application/pdf", data: pdfBase64 } },
              {
                type: "text",
                text: `Analiza este documento y genera exactamente ${numQ} preguntas de examen tipo test en español.
Devuelve ÚNICAMENTE un array JSON válido, sin markdown ni texto extra. Cada elemento debe tener:
- "question": string (la pregunta clara y completa)
- "options": array de exactamente 4 strings (sin letra de prefijo, con al menos una opción plausible incorrecta)
- "correct": number (índice 0-3 de la respuesta correcta)
- "explanation": string (explicación breve en 1-2 frases de por qué es correcta)
Varía los temas y la dificultad. Las opciones incorrectas deben ser plausibles.`
              }
            ]
          }]
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `Error ${res.status}`);
      }
      const data = await res.json();
      const raw = data.content.find(b => b.type === "text")?.text || "[]";
      const clean = raw.replace(/^```json\s*|^```\s*|```\s*$/gm, "").trim();
      const parsed = JSON.parse(clean);
      if (!Array.isArray(parsed) || !parsed.length) throw new Error("Respuesta inesperada");
      return parsed;
    }

    function App() {
      const [view, setView] = useState("home");
      const [apiKey, setApiKey] = useState(() => loadApiKey());
      const [showApiModal, setShowApiModal] = useState(false);
      useEffect(() => { idbLoadPdfs().then(setSavedPdfs).catch(() => {}); }, []);
      const [pendingAction, setPendingAction] = useState(null);
      const [pdf, setPdf] = useState(null);
      const [numQ, setNumQ] = useState(10);
      const [questions, setQuestions] = useState([]);
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [fallos, setFallos] = useState(() => loadFallos());
      const [savedPdfs, setSavedPdfs] = useState([]);
      const [isReview, setIsReview] = useState(false);
      const [dragOver, setDragOver] = useState(false);
      const [loading, setLoading] = useState(false);
      const [extracting, setExtracting] = useState(false);
      const [retryMsg, setRetryMsg] = useState("");
      const [error, setError] = useState(null);
      const fileRef = useRef();

      const handleSaveApiKey = (key) => {
        saveApiKey(key);
        setApiKey(key);
        setShowApiModal(false);
        if (pendingAction) { pendingAction(); setPendingAction(null); }
      };

      const requireApiKey = (action) => {
        if (!apiKey) { setPendingAction(() => action); setShowApiModal(true); }
        else action();
      };

      const updateFallos = useCallback((arr) => { setFallos(arr); saveFallos(arr); }, []);

      const handleFile = useCallback((file) => {
        if (!file) return;
        if (file.type !== "application/pdf") { setError("Solo se admiten archivos PDF."); return; }
        setError(null);
        const reader = new FileReader();
        reader.onload = (e) => {
          const b64 = e.target.result.split(",")[1];
          const newPdf = { name: file.name, size: (file.size / 1024 / 1024).toFixed(2) + " MB", base64: b64 };
          setPdf(newPdf);
          requireApiKey(() => startExtraction(newPdf, null));
        };
        reader.readAsDataURL(file);
      }, [apiKey]);

      const startExtraction = useCallback(async (pdfData, existingId) => {
        setExtracting(true);
        setError(null);
        try {
          const key = apiKey || loadApiKey();
          const text = await withRetry(
            () => extractTextFromPdf(pdfData.base64, key),
            msg => setRetryMsg(msg)
          );
          const enriched = { ...pdfData, textContent: text };
          setPdf(enriched);
          if (existingId) {
            await idbUpdatePdf(existingId, { textContent: text });
            setSavedPdfs(prev => prev.map(p => p.id === existingId ? { ...p, textContent: text } : p));
          } else {
            const id = await idbSavePdf(enriched);
            setSavedPdfs(prev => [...prev, { ...enriched, id }]);
          }
          setView("config");
        } catch(err) {
          setError("Error al procesar el PDF: " + err.message);
          setView("home");
        }
        setExtracting(false);
      }, [apiKey]);

      const startExam = useCallback(async () => {
        setLoading(true); setError(null); setRetryMsg("");
        try {
          const key = apiKey || loadApiKey();
          const qs = await withRetry(
            () => pdf.textContent
              ? generateFromText(pdf.textContent, numQ, key)
              : generateFromPdf(pdf.base64, numQ, key),
            msg => setRetryMsg(msg)
          );
          setRetryMsg("");
          setQuestions(qs); setAnswers({}); setSubmitted(false); setIsReview(false);
          setView("exam");
        } catch (e) { setError("Error al generar preguntas: " + e.message); }
        setLoading(false);
      }, [pdf, numQ, apiKey]);

      const startReview = useCallback(() => {
        if (!fallos.length) return;
        setQuestions(fallos.map(f => ({ question: f.question, options: f.options, correct: f.correct, explanation: f.explanation })));
        setAnswers({}); setSubmitted(false); setIsReview(true);
        setView("exam");
      }, [fallos]);

      const handleAnswer = useCallback((qi, oi) => {
        if (submitted) return;
        setAnswers(prev => ({ ...prev, [qi]: oi }));
      }, [submitted]);

      const handleSubmit = useCallback(() => {
        const unanswered = questions.filter((_, i) => answers[i] === undefined).length;
        if (unanswered > 0 && !window.confirm(`Tienes ${unanswered} pregunta${unanswered > 1 ? "s" : ""} sin responder. ¿Enviar igualmente?`)) return;
        setSubmitted(true);
        const wrongNow = questions.map((q, i) => ({ ...q, userAnswer: answers[i] })).filter(q => q.userAnswer !== q.correct);
        if (isReview) {
          const correctedTexts = new Set(questions.filter((q, i) => answers[i] === q.correct).map(q => q.question));
          const wrongTexts = new Set(wrongNow.map(w => w.question));
          let updated = fallos.filter(f => !correctedTexts.has(f.question) && !wrongTexts.has(f.question));
          updateFallos([...updated, ...wrongNow]);
        } else {
          const existingTexts = new Set(fallos.map(f => f.question));
          const toAdd = wrongNow.filter(w => !existingTexts.has(w.question));
          if (toAdd.length) updateFallos([...fallos, ...toAdd]);
        }
        setView("results");
      }, [questions, answers, isReview, fallos, updateFallos]);

      const correctCount = questions.filter((q, i) => answers[i] === q.correct).length;
      const answeredCount = Object.keys(answers).length;
      const pct = questions.length ? Math.round((correctCount / questions.length) * 100) : 0;
      const wrongCount = questions.length - correctCount;
      const scoreMsg = pct >= 90 ? "🏆 ¡Resultado excelente!" : pct >= 70 ? "👍 Buen trabajo" : pct >= 50 ? "📖 Sigue estudiando" : "💪 ¡A repasar más!";

      if (extracting) return (
        <div className="examia-app">
          <div className="glow-orb glow-orb-1" /><div className="glow-orb glow-orb-2" />
          <Header fallos={fallos} onHome={() => setView("home")} onFallos={() => setView("fallos")} onApiKey={() => setShowApiModal(true)} />
          <div className="main"><div className="loading-view">
            <div className="spinner" />
            <div>
              <div className="loading-title">Procesando PDF…</div>
              <div className="loading-sub">{retryMsg || "Extrayendo el texto del temario — solo ocurre una vez"}</div>
              <div className="loading-dots"><div className="loading-dot"/><div className="loading-dot"/><div className="loading-dot"/></div>
              <div style={{marginTop:20,fontSize:12,color:"var(--hint)",maxWidth:320,lineHeight:1.6}}>
                A partir de ahora podrás generar exámenes de este PDF sin volver a procesarlo 💡
              </div>
            </div>
          </div></div>
        </div>
      );

      if (loading) return (
        <div className="examia-app">
          <div className="glow-orb glow-orb-1" /><div className="glow-orb glow-orb-2" />
          <Header fallos={fallos} onHome={() => setView("home")} onFallos={() => setView("fallos")} onApiKey={() => setShowApiModal(true)} />
          <div className="main"><div className="loading-view">
            <div className="spinner" />
            <div>
              <div className="loading-title">Generando preguntas…</div>
              <div className="loading-sub">{retryMsg || "Creando el examen a partir del temario"}</div>
              <div className="loading-dots"><div className="loading-dot"/><div className="loading-dot"/><div className="loading-dot"/></div>
            </div>
          </div></div>
        </div>
      );

      if (view === "config") return (
        <div className="examia-app">
          <div className="glow-orb glow-orb-1" /><div className="glow-orb glow-orb-2" />
          <Header fallos={fallos} onHome={() => setView("home")} onFallos={() => setView("fallos")} onApiKey={() => setShowApiModal(true)} />
          <div className="main">
            <div className="config-wrap">
              <div className="config-title">Configurar examen</div>
              <div className="config-sub">Elige cuántas preguntas quieres responder</div>
              {pdf && <div className="file-pill">
                <div className="file-pill-icon">📄</div>
                <div style={{overflow:"hidden"}}>
                  <div className="file-pill-name">{pdf.name}</div>
                  <div className="file-pill-size">{pdf.size}</div>
                </div>
              </div>}
              {error && <div className="error-box">{error}</div>}
              <div style={{fontSize:13,fontWeight:600,color:"var(--muted)",marginBottom:12,textTransform:"uppercase",letterSpacing:1}}>Número de preguntas</div>
              <div className="qty-grid">
                {[5,10,15,20].map(n => <button key={n} className={`qty-btn ${numQ===n?"selected":""}`} onClick={() => setNumQ(n)}>{n}</button>)}
              </div>
              <div style={{display:"flex",gap:10}}>
                <button className="btn btn-ghost" onClick={() => {setView("home");setError(null);}}>← Volver</button>
                <button className="btn btn-gold btn-lg" style={{flex:1}} onClick={startExam}>Comenzar examen →</button>
              </div>
            </div>
          </div>
        </div>
      );

      if (view === "exam") return (
        <div className="examia-app">
          <div className="glow-orb glow-orb-1" /><div className="glow-orb glow-orb-2" />
          <Header fallos={fallos} onHome={() => { if(window.confirm("¿Salir del examen?")) { setView("home"); setSubmitted(false); } }} onFallos={() => { if(window.confirm("¿Salir del examen?")) { setView("fallos"); setSubmitted(false); } }} onApiKey={() => setShowApiModal(true)} />
          <div className="main" style={{paddingBottom:120}}>
            <div className="q-header-row">
              <div className="q-header-title">
                {questions.length} preguntas{" "}
                {isReview && <span className="q-mode-badge">🔁 Repaso</span>}
              </div>
              {!submitted && <div style={{fontSize:13,color:"var(--muted)"}}>Respondidas: <strong style={{color:"var(--text)"}}>{answeredCount}/{questions.length}</strong></div>}
            </div>
            {questions.map((q, qi) => {
              const userAns = answers[qi];
              const isCorrect = userAns === q.correct;
              return (
                <div key={qi} className={`q-card ${submitted?(isCorrect?"correct-card":"wrong-card"):""}`}>
                  <div className="q-num">
                    Pregunta {qi+1} de {questions.length}
                    {submitted && <span className={`tag ${isCorrect?"tag-green":"tag-red"}`} style={{marginLeft:8}}>{isCorrect?"✓ Correcta":"✗ Incorrecta"}</span>}
                  </div>
                  <div className="q-text">{q.question}</div>
                  <div className="options-grid">
                    {q.options.map((opt, oi) => {
                      let cls = "opt-btn";
                      if (submitted) {
                        if (oi === q.correct) cls += " opt-correct";
                        else if (oi === userAns) cls += " opt-wrong";
                      } else if (userAns === oi) cls += " opt-selected";
                      return (
                        <button key={oi} className={cls} onClick={() => handleAnswer(qi,oi)} disabled={submitted}>
                          <span className="opt-letter">{LETTERS[oi]}</span>{opt}
                        </button>
                      );
                    })}
                  </div>
                  {submitted && <div className="explanation"><strong>Explicación:</strong> {q.explanation}</div>}
                </div>
              );
            })}
            {submitted && (
              <div className="actions-bar">
                <button className="btn btn-gold" onClick={() => setView("home")}>🏠 Inicio</button>
                {!isReview && pdf && <button className="btn btn-ghost" onClick={() => {setView("config");setSubmitted(false);}}>🔄 Nuevo examen</button>}
                {fallos.length > 0 && <button className="btn btn-outline" onClick={() => setView("fallos")}>📋 Ver fallos</button>}
              </div>

          </div>
          <div className="sticky-bar">
            {submitted ? (
              <>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <span className="tag tag-green">✓ {correctCount} correctas</span>
                  {wrongCount > 0 && <span className="tag tag-red">✗ {wrongCount} incorrectas</span>}

                <button className="btn btn-gold" onClick={() => setView("results")}>Ver resultados →</button>

          <div className="glow-orb glow-orb-1" /><div className="glow-orb glow-orb-2" />

          <div className="main">
            <div className="results-hero">
              <div className="score-circle"><div className="score-num">{pct}%</div><div className="score-pct">puntuación</div></div>

              <div className="score-sub">{correctCount} correctas de {questions.length} preguntas</div>
              <div className="stats-row">
                <div className="stat-box g"><div className="stat-n">{correctCount}</div><div className="stat-l">Correctas</div></div>
                <div className="stat-box r"><div className="stat-n">{wrongCount}</div><div className="stat-l">Incorrectas</div></div>

            {wrongCount > 0 && <div className="fallos-notice">📌 <span><strong style={{color:"var(--red)"}}>{wrongCount} pregunta{wrongCount>1?"s":""}</strong> guardada{wrongCount>1?"s":""} en Fallos para repasar</span></div>}
            {isReview && <div className={`review-banner ${correctCount===questions.length?"success":"warning"}`}>{correctCount===questions.length?"🎉 ¡Has corregido todos los fallos!": `🔁 Aún quedan ${wrongCount} por dominar. ¡Sigue repasando!`}</div>}
            <div className="actions-bar">
              <button className="btn btn-gold btn-lg" onClick={() => setView("home")}>🏠 Inicio</button>
              <button className="btn btn-ghost" onClick={() => setView("exam")}>👁 Revisar respuestas</button>
              {fallos.length > 0 && <button className="btn btn-outline" onClick={() => setView("fallos")}>📋 Ver mis fallos</button>}

        </div>
      );

      if (view === "fallos") return (

          <div className="glow-orb glow-orb-1" /><div className="glow-orb glow-orb-2" />
          <Header fallos={fallos} onHome={() => setView("home")} onFallos={() => setView("fallos")} onApiKey={() => setShowApiModal(true)} active="fallos" />
          <div className="main">
            <div className="fallos-page-header">
              <div>
                <div className="page-title">Mis fallos</div>
                <div className="page-sub">{fallos.length} pregunta{fallos.length!==1?"s":""} pendiente{fallos.length!==1?"s":""}</div>
              </div>
              {fallos.length > 0 && <div style={{display:"flex",gap:8}}>
                <button className="btn btn-gold" onClick={startReview}>🔁 Repasar</button>
                <button className="btn btn-danger-outline" onClick={() => {if(window.confirm("¿Eliminar todos los fallos?")) updateFallos([]);}}>🗑 Borrar</button>
              </div>}
            </div>
            {fallos.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">🎯</div>
                <div className="empty-title">¡Sin errores guardados!</div>
                <div className="empty-sub">Cuando falles preguntas en un examen, aparecerán aquí</div>
                <button className="btn btn-ghost" style={{marginTop:24}} onClick={() => setView("home")}>Hacer un examen</button>
              </div>
            ) : fallos.map((f, i) => (
              <div key={i} className="fallo-item">
                <div className="fallo-q">{f.question}</div>
                <div className="fallo-correct">Respuesta correcta: <span>{f.options[f.correct]}</span></div>
              </div>
            ))}
          </div>
        </div>
      );

      const useSavedPdf = (saved) => {
        if (saved.textContent) {
          setPdf(saved);
          requireApiKey(() => setView("config"));
        } else {
          setPdf(saved);
          requireApiKey(() => startExtraction(saved, saved.id));
        }
      };
      const deleteSavedPdf = async (id, e) => {
        e.stopPropagation();
        await idbDeletePdf(id).catch(() => {});
        setSavedPdfs(prev => prev.filter(p => p.id !== id));

      return (
        <div className="examia-app">

            <div className="hero-title">Convierte tu temario<br />en un <em>examen tipo test</em></div>
            <div className="hero-sub">Sube el PDF de tus apuntes y la IA generará preguntas aleatorias, corregirá tus respuestas y guardará tus errores para repasar.</div>
            {error && <div className="error-box" style={{marginBottom:20}}>{error}</div>}

            {savedPdfs.length > 0 && (
              <div style={{marginBottom:28}}>
                <div style={{fontSize:12,fontWeight:600,color:"var(--muted)",textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>PDFs guardados</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10}}>
                  {savedPdfs.map(p => (
                    <div key={p.id} onClick={() => useSavedPdf(p)}
                      style={{background:"var(--surface)",border:"1.5px solid var(--border)",borderRadius:"var(--r)",padding:"16px",cursor:"pointer",transition:"all 0.18s",position:"relative"}}
                      onMouseEnter={e => { e.currentTarget.style.borderColor="var(--gold)"; e.currentTarget.style.background="var(--gold-dim)"; }}
                      onMouseLeave={e => { e.currentTarget.style.borderColor="var(--border)"; e.currentTarget.style.background="var(--surface)"; }}
                    >
                      <div style={{fontSize:24,marginBottom:8}}>📄</div>
                      <div style={{fontSize:13,fontWeight:600,color:"var(--text)",marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingRight:24}}>{p.name}</div>
                      <div style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--muted)"}}>
                        {p.size} · {new Date(p.savedAt).toLocaleDateString("es-ES",{day:"2-digit",month:"short"})}
                        {p.textContent
                          ? <span style={{color:"var(--green)",fontWeight:600}}>✓ listo</span>
                          : <span style={{color:"var(--gold)"}}>⏳ pendiente</span>}
                      </div>
                      <button onClick={e => deleteSavedPdf(p.id, e)} title="Eliminar"
                        style={{position:"absolute",top:10,right:10,background:"transparent",border:"none",cursor:"pointer",fontSize:14,color:"var(--hint)",padding:"2px 6px",borderRadius:4,transition:"color 0.2s"}}
                        onMouseEnter={e => e.currentTarget.style.color="var(--red)"}
                        onMouseLeave={e => e.currentTarget.style.color="var(--hint)"}
                      >✕</button>
                    </div>
                  ))}
                </div>
                <div className="divider">o sube uno nuevo</div>
              </div>
            )}

            <div
              className={`upload-zone ${dragOver?"dragover":""}`}
              onClick={() => fileRef.current.click()}
              onDragOver={e => {e.preventDefault();setDragOver(true);}}
              onDragLeave={() => setDragOver(false)}
              onDrop={e => {e.preventDefault();setDragOver(false);handleFile(e.dataTransfer.files[0]);}}
            >
              <div className="upload-icon">📄</div>
              <div className="upload-title">Arrastra tu PDF aquí</div>
              <div className="upload-hint">o haz clic para buscar el archivo</div>
              <input ref={fileRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={e => handleFile(e.target.files[0])} />
            </div>
            {fallos.length > 0 && <>
              <div className="divider">o</div>
              <div className="card">
                <div className="fallos-cta">
                  <div className="fallos-cta-info">
                    <h3>📋 Repasar mis fallos <span className="badge" style={{verticalAlign:"middle"}}>{fallos.length}</span></h3>
                    <p>Practica las preguntas que respondiste mal</p>
                  </div>
                  <button className="btn btn-gold" onClick={startReview}>Repasar ahora →</button>
                </div>
              </div>
            </>}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <script>
    // Expose logout globally so the app can call it
    window.examiaLogout = async function() {
      await fetch("/api/logout");
      window.location.replace("/login.html");
    };
  </script>
</body>
</html>
